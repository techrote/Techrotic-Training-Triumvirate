[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ttt-langgraph-spike"
version = "0.1.0"
description = "Contained LangGraph checkpoint/branch/correction/replay spike for Techrotic Training Triumvirate"
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.17",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttt_langgraph_spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
