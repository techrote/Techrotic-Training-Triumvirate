[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ttt-concordia-spike"
version = "0.1.0"
description = "Contained Concordia deterministic Game Master visibility spike for Techrotic Training Triumvirate"
requires-python = ">=3.12"
dependencies = [
  "gdm-concordia==2.4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttt_concordia_spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
