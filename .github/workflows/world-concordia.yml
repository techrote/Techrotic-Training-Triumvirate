name: World Concordia parity

on:
  pull_request:
    paths:
      - "src/techrotic_training_triumvirate/world/**"
      - "src/techrotic_training_triumvirate/commands/**"
      - "src/techrotic_training_triumvirate/schemas/**"
      - "tests/test_world_concordia.py"
      - "pyproject.toml"
      - ".github/workflows/world-concordia.yml"
  push:
    branches: [main]
    paths:
      - "src/techrotic_training_triumvirate/world/**"
      - "src/techrotic_training_triumvirate/commands/**"
      - "src/techrotic_training_triumvirate/schemas/**"
      - "tests/test_world_concordia.py"
      - "pyproject.toml"
      - ".github/workflows/world-concordia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install TTT with optional Concordia host
        run: python -m pip install -e ".[dev,concordia]"
      - name: Run Concordia parity fixture
        run: python -m pytest tests/test_world_concordia.py
