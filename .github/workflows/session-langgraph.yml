name: Session LangGraph

on:
  pull_request:
    paths:
      - "src/techrotic_training_triumvirate/session/**"
      - "src/techrotic_training_triumvirate/recovery/**"
      - "src/techrotic_training_triumvirate/corpus/**"
      - "src/techrotic_training_triumvirate/evaluation/**"
      - "tests/test_session_*.py"
      - "tests/test_recovery*.py"
      - "pyproject.toml"
      - ".github/workflows/session-langgraph.yml"
  push:
    branches: [main]
    paths:
      - "src/techrotic_training_triumvirate/session/**"
      - "src/techrotic_training_triumvirate/recovery/**"
      - "src/techrotic_training_triumvirate/corpus/**"
      - "src/techrotic_training_triumvirate/evaluation/**"
      - "tests/test_session_*.py"
      - "tests/test_recovery*.py"
      - "pyproject.toml"
      - ".github/workflows/session-langgraph.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session:
    name: session / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install session integration and dev tools
        run: python -m pip install -e ".[dev,session]"
      - name: Run session tests
        run: python -m pytest tests/test_session_rendering.py tests/test_session_langgraph.py tests/test_recovery.py tests/test_recovery_langgraph.py
