[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "techrotic-training-triumvirate"
dynamic = ["version"]
description = "Reproducible training laboratory for compact, characterful NPC commanders."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.14,<0.15",
]

[project.scripts]
ttt = "techrotic_training_triumvirate.cli:main"

[tool.hatch.version]
path = "src/techrotic_training_triumvirate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/techrotic_training_triumvirate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
